version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:5000"
    volumes:
      - ./src:/app/src
    environment:
      - MONGO_URI=mongodb://mongo:27017/cocdb
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local